{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="margin-top:0;">Create Customer Account</h2>
    <form method="POST">
        <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
        
        <div class="form-group"><label>Email Address</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%; background:#4f46e5;">Register</button>
    </form>
    <p style="text-align:center; font-size:0.9rem; margin-top:1.5rem;">Already have an account? <a href="/customer/login">Login here</a></p>
</div>
{% endblock %}
